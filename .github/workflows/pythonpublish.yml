name: Upload Python Package

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install uv==0.12.15
          uv sync --locked --extra dev

      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run python - <<'PY'
          import os
          import api2ch

          expected_tag = f'v{api2ch.__version__}'
          release_tag = os.environ['RELEASE_TAG']
          if release_tag != expected_tag:
              raise SystemExit(
                  f'Release tag {release_tag!r} does not match package version {api2ch.__version__!r}'
              )
          PY

      - name: Build distributions
        run: uv run python -m build

      - name: Check distributions
        run: uv run python -m twine check --strict dist/*

      - name: Test wheel installation
        run: |
          python -m venv "${RUNNER_TEMP}/api2ch-wheel"
          "${RUNNER_TEMP}/api2ch-wheel/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/api2ch-wheel/bin/python" -c "import api2ch; print(api2ch.__version__)"

      - name: Test source distribution installation
        run: |
          python -m venv "${RUNNER_TEMP}/api2ch-sdist"
          "${RUNNER_TEMP}/api2ch-sdist/bin/python" -m pip install dist/*.tar.gz
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/api2ch-sdist/bin/python" -c "import api2ch; print(api2ch.__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/api2ch
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

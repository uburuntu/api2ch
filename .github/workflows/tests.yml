name: Python Tests

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:
    inputs:
      live_tests:
        description: Run tests against the live 2ch API
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check Python sources
        run: ruff check --select=E9,F63,F7,F82 .

      - name: Run offline tests
        run: pytest tests/ -vl -m "not integration" --cov=api2ch --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          fail_ci_if_error: true
          files: coverage.xml
          flags: unittests

  package:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check --strict dist/*

      - name: Test wheel installation
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/api2ch-wheel"
          "${RUNNER_TEMP}/api2ch-wheel/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/api2ch-wheel/bin/python" -c "import api2ch; print(api2ch.__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Live API tests
    if: github.event_name == 'workflow_dispatch' && inputs.live_tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run live tests
        run: pytest tests/ -vl -m integration
